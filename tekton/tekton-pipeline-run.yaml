apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: build-and-push-run-001  # Changed from generateName to a fixed name
spec:
  pipelineRef:
    name: build-and-push-pipeline
  workspaces:
  - name: shared-workspace
    persistentVolumeClaim:
      claimName: pipeline-pvc
  podTemplate:
    securityContext:
      fsGroup: 65532
    volumes:
    - name: docker-config
      secret:
        secretName: docker-credentials